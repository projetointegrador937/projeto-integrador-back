name: Deploy para EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Deploy na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_EC2 }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H 3.16.111.34 >> ~/.ssh/known_hosts

      - name: Instalar/atualizar Docker e plugins na EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e

          # Docker
          if ! command -v docker &> /dev/null; then
            echo "Instalando Docker..."
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ec2-user
          else
            echo "Docker ja instalado: $(docker --version)"
          fi

          # Descobre a versao mais recente do buildx e compose via API do GitHub
          BUILDX_VERSION=$(curl -fsSL https://api.github.com/repos/docker/buildx/releases/latest | grep tag_name | cut -d'"' -f4)
          COMPOSE_VERSION=$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest | grep tag_name | cut -d'"' -f4)

          echo "Instalando buildx $BUILDX_VERSION em /usr/libexec/docker/cli-plugins/..."
          sudo curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
            -o /usr/libexec/docker/cli-plugins/docker-buildx
          sudo chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
          echo "Buildx: $(docker buildx version)"

          echo "Instalando Docker Compose $COMPOSE_VERSION..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          echo "Compose: $(sudo docker compose version)"
          EOF

      - name: Copiar arquivos para a EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='**/bin' \
            --exclude='**/obj' \
            ./ ec2-user@3.16.111.34:/home/ec2-user/projeto-integrador-back/

      - name: Criar arquivo .env na EC2
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_MINUTES }}
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 "cat > /home/ec2-user/projeto-integrador-back/.env" << EOF
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:8080
          JWT_KEY=${JWT_KEY}
          JWT_ISSUER=${JWT_ISSUER}
          JWT_AUDIENCE=${JWT_AUDIENCE}
          JWT_ACCESS_TOKEN_MINUTES=${JWT_ACCESS_TOKEN_MINUTES}
          EOF

      - name: Instalar Nginx e Certbot na EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          if ! command -v nginx >/dev/null 2>&1; then
            sudo dnf install -y nginx || sudo yum install -y nginx
            sudo systemctl enable nginx
          fi
          if ! command -v certbot >/dev/null 2>&1; then
            sudo dnf install -y certbot python3-certbot-nginx || sudo yum install -y certbot python3-certbot-nginx
          fi
          EOF

      - name: Build e subir containers com Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          cd /home/ec2-user/projeto-integrador-back
          sudo docker compose build --no-cache api
          sudo docker compose up -d --remove-orphans
          sudo docker compose ps
          EOF

      - name: Configurar Nginx como proxy reverso HTTP
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          sudo tee /etc/nginx/conf.d/api-navalhacorte.conf > /dev/null << 'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name api-navalhacorte.ddns.net;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }
          NGINX
          sudo nginx -t
          sudo systemctl restart nginx
          EOF

      - name: Emitir ou renovar certificado Let's Encrypt
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          if [ -z "$CERTBOT_EMAIL" ]; then
            echo "O secret CERTBOT_EMAIL precisa ser configurado no GitHub."
            exit 1
          fi
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash -s -- "$CERTBOT_EMAIL" << 'EOF'
          set -e
          CERTBOT_EMAIL="$1"
          sudo certbot --nginx             --non-interactive             --agree-tos             --email "$CERTBOT_EMAIL"             --redirect             --keep-until-expiring             -d api-navalhacorte.ddns.net
          sudo systemctl enable certbot-renew.timer 2>/dev/null || true
          sudo systemctl enable certbot-renew 2>/dev/null || true
          sudo certbot renew --dry-run
          EOF

      - name: Aguardar API ficar saudável
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          echo "Aguardando API responder..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "API esta no ar!"
              exit 0
            fi
            echo "Tentativa $i/24 - aguardando 5s..."
            sleep 5
          done
          echo "Timeout: API nao respondeu em 120s. Logs:"
          sudo docker compose -f /home/ec2-user/projeto-integrador-back/docker-compose.yml logs api --tail=50
          exit 1
          EOF
