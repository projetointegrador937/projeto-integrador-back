name: Deploy para EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Deploy na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_EC2 }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H 3.16.111.34 >> ~/.ssh/known_hosts

      - name: Instalar/atualizar Docker e buildx na EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e

          # Docker
          if ! command -v docker &> /dev/null; then
            echo "Instalando Docker..."
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ec2-user
          else
            echo "Docker ja instalado: $(docker --version)"
          fi

          # Docker Compose plugin
          COMPOSE_PATH=/usr/local/lib/docker/cli-plugins/docker-compose
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          echo "Instalando Docker Compose plugin..."
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o $COMPOSE_PATH
          sudo chmod +x $COMPOSE_PATH
          echo "Docker Compose: $(sudo docker compose version)"

          # Buildx plugin
          BUILDX_PATH=/usr/local/lib/docker/cli-plugins/docker-buildx
          echo "Instalando Docker Buildx..."
          sudo curl -fsSL https://github.com/docker/buildx/releases/latest/download/buildx-v0.20.0.linux-amd64 \
            -o $BUILDX_PATH
          sudo chmod +x $BUILDX_PATH
          echo "Buildx: $(sudo docker buildx version)"
          EOF

      - name: Copiar arquivos para a EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='**/bin' \
            --exclude='**/obj' \
            ./ ec2-user@3.16.111.34:/home/ec2-user/projeto-integrador-back/

      - name: Criar arquivo .env na EC2
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_MINUTES }}
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 "cat > /home/ec2-user/projeto-integrador-back/.env" << EOF
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:8080
          JWT_KEY=${JWT_KEY}
          JWT_ISSUER=${JWT_ISSUER}
          JWT_AUDIENCE=${JWT_AUDIENCE}
          JWT_ACCESS_TOKEN_MINUTES=${JWT_ACCESS_TOKEN_MINUTES}
          EOF

      - name: Build e subir containers com Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          cd /home/ec2-user/projeto-integrador-back
          sudo docker compose build --no-cache api
          sudo docker compose up -d --remove-orphans
          sudo docker compose ps
          EOF

      - name: Aguardar API ficar saudável
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          echo "Aguardando API responder..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "API esta no ar!"
              exit 0
            fi
            echo "Tentativa $i/24 - aguardando 5s..."
            sleep 5
          done
          echo "Timeout: API nao respondeu em 120s. Logs:"
          sudo docker compose -f /home/ec2-user/projeto-integrador-back/docker-compose.yml logs api --tail=50
          exit 1
          EOF
