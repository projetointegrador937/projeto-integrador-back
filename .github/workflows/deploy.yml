name: Deploy para EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Deploy na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_EC2 }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H 3.16.111.34 >> ~/.ssh/known_hosts

      - name: Instalar Docker na EC2 (se necessário)
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e

          if command -v docker &> /dev/null; then
            echo "Docker ja instalado: $(docker --version)"
            exit 0
          fi

          echo "Instalando Docker..."
          sudo yum update -y
          sudo yum install -y docker
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo usermod -aG docker ec2-user

          echo "Instalando Docker Compose plugin..."
          DOCKER_CONFIG=/usr/local/lib/docker
          sudo mkdir -p $DOCKER_CONFIG/cli-plugins
          sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

          echo "Docker instalado: $(docker --version)"
          echo "Docker Compose instalado: $(docker compose version)"
          EOF

      - name: Copiar arquivos para a EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='**/bin' \
            --exclude='**/obj' \
            ./ ec2-user@3.16.111.34:/home/ec2-user/projeto-integrador-back/

      - name: Criar arquivo .env na EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 \
            "cat > /home/ec2-user/projeto-integrador-back/.env" << 'ENVEOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:8080
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_MINUTES=${{ secrets.JWT_ACCESS_TOKEN_MINUTES }}
          ENVEOF

      - name: Build e subir containers com Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          cd /home/ec2-user/projeto-integrador-back
          docker compose build --no-cache api
          docker compose up -d --remove-orphans
          docker compose ps
          EOF

      - name: Aguardar API ficar saudável
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ec2-user@3.16.111.34 bash << 'EOF'
          set -e
          echo "Aguardando API responder..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "API esta no ar!"
              exit 0
            fi
            echo "Tentativa $i/24 - aguardando 5s..."
            sleep 5
          done
          echo "Timeout: API nao respondeu em 120s. Logs:"
          docker compose -f /home/ec2-user/projeto-integrador-back/docker-compose.yml logs api --tail=50
          exit 1
          EOF
